// Murine as an app: the launcher library (the root project) with its Home entry. Built by the fork's CI to check
// the launcher builds and runs without droidtop (Droidtop/tracker#921); it is not released.
// By id alone: the root project (the launcher library) already put AGP and Kotlin on the classpath, and Gradle
// refuses a versioned request for a plugin already there (run 42287245323).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.murinelauncher.app'
    compileSdk 36

    defaultConfig {
        applicationId 'app.murinelauncher.standalone'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':')
}
