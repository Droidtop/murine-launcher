name: Murine build

# The launcher on its own (Droidtop/tracker#921): the library and the Murine app build, and the launcher's unit tests
# pass, with none of droidtop's code. Nothing is released from here; droidtop builds the launcher as its shell-default
# submodule and ships it.
on:
  push:
    branches: [droidtop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: murine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17 + 21
        # Several of the AOSP libraries ask for a JDK 21 toolchain; the rest builds on 17.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build the Murine app
        run: ./gradlew :murine-app:assembleDebug --stacktrace

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew :testDebugUnitTest --stacktrace
